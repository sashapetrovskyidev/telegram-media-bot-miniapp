<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WERYPEAS</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a1a1a;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }
        canvas { display: block; }
    </style>
</head>
<body>
<script>
    // --- GLOBAL MAP STYLE ---
    window.mapStyle = 'default';
    // --- GLOBAL STATE (persists across scenes) ---
    window.activeAudio = null;
    window.activeItems = {};
    window.roomLightMode = 'default';
    window.tvGameMode = 'off';
    window.timeOfDay = 'day';
    window.nightTriggered = false;
    window.currentTrack = 'off';
    const LIGHT_MODES = ['default', 'blue', 'pink', 'green'];
    const APOLLO_TRACKS = ['off', 'track1', 'track2'];
    const APOLLO_TRACK_KEYS = { 'track1': 'sound_audio_interface', 'track2': 'sound_guitar' };
    const APOLLO_TRACK_NAMES = { 'off': 'OFF', 'track1': 'TRACK 1', 'track2': 'TRACK 2' };
    const TV_GAMES = ['off', 'fortnite', 'mortal_kombat', 'naruto'];
    const TV_GAME_TEXTURES = { 'fortnite': 'tv_fortnite', 'mortal_kombat': 'tv_mortal_kombat', 'naruto': 'tv_naruto' };
    // --- WARDROBE (модный шкафчик) ---
    const WARDROBE_ITEMS = [
        { key: 'wardrobe_1', texture: 'ward_1', label: 'Ricky Owens', description: 'Flexiing, green and fresh' },
        { key: 'wardrobe_2', texture: 'ward_2', label: 'Vase', description: 'Сгонять за цветами надо бы..' },
        { key: 'wardrobe_3', texture: 'ward_3', label: 'Stanley', description: 'Обожаю пить с этого засранца' },
        { key: 'wardrobe_4', texture: 'ward_4', label: 'Eifel Tower', description: 'Может Париж и лучший город в мире..' },
        { key: 'wardrobe_5', texture: 'ward_5', label: 'Fashion Books', description: 'Тут Chanel, Balenciaga и Dior' },
		{ key: 'wardrobe_6', texture: 'ward_6', label: 'Prada', description: 'Одену их завтра' },
		{ key: 'wardrobe_7', texture: 'ward_7', label: 'Monro', description: 'У неё определённо талант..' },
		{ key: 'wardrobe_8', texture: 'ward_8', label: 'Golden Goose', description: 'Не помню от чего этот пакет' },
		{ key: 'wardrobe_9', texture: 'ward_9', label: 'Bear Brick', description: 'E-e. brickyboy' },
    ];
    window.wardrobeIndex = -1; // -1 = nothing shown
    function getStyleFolder() { return 'assets/' + (window.mapStyle || 'default') + '/'; }
    const PERSON_TEXTURES = { 'default': 'playerSprite', 'blue': 'playerSprite_blue', 'pink': 'playerSprite_pink', 'green': 'playerSprite_green' };

    // --- START MENU SCENE ---
    class MenuScene extends Phaser.Scene {
        constructor() { super('MenuScene'); }
        preload() {
            this.load.image('menuBg', 'assets/menu_bg.jpg');
            this.load.on('loaderror', (file) => { console.error('Ошибка загрузки: ' + file.key); });
        }
        create() {
            const { width, height } = this.scale;
            const bg = this.add.image(width / 2, height / 2, 'menuBg');
            const bgScale = Math.max(width / bg.width, height / bg.height);
            bg.setScale(bgScale);
            const overlay = this.add.graphics();
            overlay.fillStyle(0x000000, 0.45);
            overlay.fillRect(0, 0, width, height);
            const panelW = 580, panelH = 520, panelX = width / 2, panelY = height * 0.46, panelR = 30;
            const panelGfx = this.add.graphics();
            panelGfx.fillStyle(0x0a0a0f, 0.65);
            panelGfx.fillRoundedRect(panelX - panelW/2, panelY - panelH/2, panelW, panelH, panelR);
            panelGfx.lineStyle(1, 0xffffff, 0.12);
            panelGfx.strokeRoundedRect(panelX - panelW/2, panelY - panelH/2, panelW, panelH, panelR);
            panelGfx.fillStyle(0xffffff, 0.06);
            panelGfx.fillRoundedRect(panelX - panelW/2 + 1, panelY - panelH/2 + 1, panelW - 2, panelH * 0.3, { tl: panelR, tr: panelR, bl: 0, br: 0 });
            const title = this.add.text(width / 2, panelY - panelH/2 + 80, 'WERYPEAS', {
                fontSize: '72px', fontFamily: 'Courier New, monospace', color: '#ffffff', fontStyle: 'bold', stroke: '#000000', strokeThickness: 4,
            }).setOrigin(0.5);
            this.tweens.add({ targets: title, alpha: { from: 0.85, to: 1 }, duration: 2500, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
            const lineGfx = this.add.graphics();
            lineGfx.fillStyle(0xffffff, 0.15);
            lineGfx.fillRect(width / 2 - 140, panelY - panelH/2 + 125, 280, 1);
            const btnY = panelY - panelH/2 + 210;
            this.createGlassButton(width / 2, btnY, 400, 68, 'START GAME', () => {
                this.cameras.main.fadeOut(500, 0, 0, 0);
                this.time.delayedCall(500, () => { this.scene.start('MainScene'); });
            });
            const socialY = panelY - panelH/2 + 340, socialSpacing = 110;
            const socials = [{ label: 'TG', color: 0x26A5E4 }, { label: 'IG', color: 0xE1306C }, { label: 'YT', color: 0xFF0000 }, { label: 'SC', color: 0xFF5500 }];
            const totalSocialW = (socials.length - 1) * socialSpacing;
            const startX = width / 2 - totalSocialW / 2;
            socials.forEach((s, i) => { this.createSocialButton(startX + i * socialSpacing, socialY, 80, s.label, s.color); });
            this.add.text(width / 2, socialY - 60, 'FOLLOW US', { fontSize: '20px', fontFamily: 'Courier New', color: '#ffffff', fontStyle: 'bold' }).setOrigin(0.5).setAlpha(0.35);
            this.cameras.main.fadeIn(800, 0, 0, 0);
        }
        createGlassButton(x, y, w, h, text, callback) {
            const r = h / 2;
            const gfx = this.add.graphics();
            const drawGlass = (fillAlpha, borderAlpha, highlightAlpha) => {
                gfx.clear();
                gfx.fillStyle(0xffffff, borderAlpha * 0.15); gfx.fillRoundedRect(x - w/2 - 2, y - h/2 - 2, w + 4, h + 4, r + 2);
                gfx.fillStyle(0xffffff, fillAlpha); gfx.fillRoundedRect(x - w/2, y - h/2, w, h, r);
                gfx.fillStyle(0xffffff, highlightAlpha); gfx.fillRoundedRect(x - w/2 + 6, y - h/2 + 3, w - 12, h * 0.35, { tl: r - 3, tr: r - 3, bl: 0, br: 0 });
                gfx.lineStyle(1, 0xffffff, borderAlpha * 0.3); gfx.strokeRoundedRect(x - w/2, y - h/2, w, h, r);
            };
            drawGlass(0.12, 0.25, 0.08);
            const btnText = this.add.text(x, y, text, { fontSize: '34px', fontFamily: 'Courier New', color: '#ffffff', fontStyle: 'bold' }).setOrigin(0.5);
            const hitArea = this.add.rectangle(x, y, w, h, 0x000000, 0).setInteractive({ useHandCursor: true });
            hitArea.on('pointerover', () => { drawGlass(0.20, 0.4, 0.14); });
            hitArea.on('pointerout', () => { drawGlass(0.12, 0.25, 0.08); });
            hitArea.on('pointerdown', () => { drawGlass(0.08, 0.15, 0.04); this.tweens.add({ targets: [gfx, hitArea, btnText], scaleX: 0.96, scaleY: 0.96, duration: 80, yoyo: true, onComplete: callback }); });
        }
        createSocialButton(x, y, size, label, accentColor) {
            const r = size / 2;
            const gfx = this.add.graphics();
            const drawCircle = (fillAlpha, borderAlpha) => {
                gfx.clear();
                gfx.lineStyle(2, accentColor, borderAlpha); gfx.strokeCircle(x, y, r + 1);
                gfx.fillStyle(0xffffff, fillAlpha); gfx.fillCircle(x, y, r);
                gfx.fillStyle(0xffffff, fillAlpha * 0.6); gfx.fillEllipse(x, y - r * 0.25, size * 0.6, size * 0.35);
            };
            drawCircle(0.10, 0.4);
            const btnText = this.add.text(x, y, label, { fontSize: '28px', fontFamily: 'Courier New', color: '#ffffff', fontStyle: 'bold' }).setOrigin(0.5);
            const hitArea = this.add.circle(x, y, r, 0x000000, 0).setInteractive({ useHandCursor: true });
            hitArea.on('pointerover', () => { drawCircle(0.20, 0.7); btnText.setStyle({ color: Phaser.Display.Color.IntegerToColor(accentColor).rgba }); });
            hitArea.on('pointerout', () => { drawCircle(0.10, 0.4); btnText.setColor('#ffffff'); });
            hitArea.on('pointerdown', () => { this.tweens.add({ targets: [gfx, hitArea, btnText], scaleX: 0.90, scaleY: 0.90, duration: 100, yoyo: true }); });
        }
    }

    // --- ГЛАВНАЯ СЦЕНА (ГОСТИНАЯ) ---
    class MainScene extends Phaser.Scene {
        constructor() { super('MainScene'); }
        preload() {
            const folder = getStyleFolder();
            this.load.image('room1_day', folder + 'room1_day.png');
            this.load.image('room1_night', folder + 'room1_night.png');
            this.load.spritesheet('playerSprite', folder + 'person.png', { frameWidth: 512, frameHeight: 512 });
            this.load.spritesheet('playerSprite_blue', folder + 'person_blue.png', { frameWidth: 512, frameHeight: 512 });
            this.load.spritesheet('playerSprite_pink', folder + 'person_pink.png', { frameWidth: 512, frameHeight: 512 });
            this.load.spritesheet('playerSprite_green', folder + 'person_green.png', { frameWidth: 512, frameHeight: 512 });
            this.load.image('line_guitar', 'assets/interaction/action_guitar.png');
            this.load.image('line_ps_controller', 'assets/interaction/action_ps_controller.png');
            this.load.image('tv_fortnite', 'assets/interaction/action_ps_controller_tv_fortnite.png');
            this.load.image('tv_mortal_kombat', 'assets/interaction/action_ps_controller_tv_mortal_kombat.png');
            this.load.image('tv_naruto', 'assets/interaction/action_ps_controller_tv_naruto.png');
            this.load.image('room1_blue', folder + 'room1_blue.png');
            this.load.image('room1_pink', folder + 'room1_pink.png');
            this.load.image('room1_green', folder + 'room1_green.png');
            this.load.audio('sound_guitar', 'assets/sound/sound_guitar.mp3');
            this.load.audio('sound_audio_interface', 'assets/sound/sound_audio_interface.mp3');
            this.load.on('loaderror', (file) => { console.error('ОШИБКА загрузки: ' + file.key, file.url); });
        }
        create() {
            const screenWidth = this.scale.width;
            const screenHeight = this.scale.height;
            let room1Key;
            if (window.timeOfDay === 'night' && window.roomLightMode !== 'default') { room1Key = 'room1_' + window.roomLightMode; }
            else { room1Key = window.timeOfDay === 'night' ? 'room1_night' : 'room1_day'; }
            const bg = this.add.image(0, 0, room1Key).setOrigin(0, 0);
            this.bg = bg;
            const scaleX = screenWidth / bg.width;
            const scaleY = screenHeight / bg.height;
            const scale = Math.max(scaleX, scaleY);
            bg.setScale(scale);
            const roomWidth = bg.width * scale;
            const roomHeight = bg.height * scale;
            this.physics.world.setBounds(0, 0, roomWidth, roomHeight);

            // Store scale for overlays
            this.bgScale = scale;

            // Create animations
            const personVariants = ['playerSprite', 'playerSprite_blue', 'playerSprite_pink', 'playerSprite_green'];
            personVariants.forEach(spriteKey => {
                const suffix = spriteKey === 'playerSprite' ? '' : spriteKey.replace('playerSprite', '');
                if (!this.anims.exists('walk-down' + suffix)) {
                    this.anims.create({ key: 'walk-down' + suffix, frames: this.anims.generateFrameNumbers(spriteKey, { start: 0, end: 3 }), frameRate: 8, repeat: -1 });
                    this.anims.create({ key: 'walk-left' + suffix, frames: this.anims.generateFrameNumbers(spriteKey, { start: 4, end: 7 }), frameRate: 8, repeat: -1 });
                    this.anims.create({ key: 'walk-up' + suffix, frames: this.anims.generateFrameNumbers(spriteKey, { start: 8, end: 11 }), frameRate: 8, repeat: -1 });
                    this.anims.create({ key: 'walk-right' + suffix, frames: this.anims.generateFrameNumbers(spriteKey, { start: 12, end: 15 }), frameRate: 8, repeat: -1 });
                    this.anims.create({ key: 'idle-down' + suffix, frames: [{ key: spriteKey, frame: 0 }] });
                    this.anims.create({ key: 'idle-left' + suffix, frames: [{ key: spriteKey, frame: 4 }] });
                    this.anims.create({ key: 'idle-up' + suffix, frames: [{ key: spriteKey, frame: 8 }] });
                    this.anims.create({ key: 'idle-right' + suffix, frames: [{ key: spriteKey, frame: 12 }] });
                }
            });
            this.playerAnimSuffix = '';
            if (window.timeOfDay === 'night' && window.roomLightMode !== 'default') { this.playerAnimSuffix = '_' + window.roomLightMode; }
            const personKey = (window.timeOfDay === 'night' && window.roomLightMode !== 'default') ? PERSON_TEXTURES[window.roomLightMode] : 'playerSprite';
            const fromStudio = this.scene.settings.data?.fromStudio;
            this.player = fromStudio
                ? this.physics.add.sprite(roomWidth * 0.50, roomHeight * 0.72, personKey)
                : this.physics.add.sprite(roomWidth * 0.55, roomHeight * 0.75, personKey);
            this.player.setScale(0.7).setOrigin(0.5, 1).setDepth(15);
            this.player.setCollideWorldBounds(true);
            this.player.body.setSize(20, 10).setOffset(22, 54);
            this.player.anims.play('idle-down' + this.playerAnimSuffix);
            this.playerDirection = 'down';
            this.cameras.main.startFollow(this.player, true, 0.08, 0.08);
            this.cameras.main.setBounds(0, 0, roomWidth, roomHeight);
            this.cameras.main.setZoom(1.6);
            this.cameras.main.setFollowOffset(0, 300);
            this.targetX = null; this.targetY = null; this.isTransitioning = false;
            this.cursors = this.input.keyboard.createCursorKeys();
            this.wasd = this.input.keyboard.addKeys({ up: Phaser.Input.Keyboard.KeyCodes.W, down: Phaser.Input.Keyboard.KeyCodes.S, left: Phaser.Input.Keyboard.KeyCodes.A, right: Phaser.Input.Keyboard.KeyCodes.D });

            // --- MOBILE VIRTUAL JOYSTICK ---
            this.virtualInput = { x: 0, y: 0 };
            const joyX = 350, joyY = screenHeight - 500, joyR = 100;
            const joyBase = this.add.graphics().setScrollFactor(0).setDepth(190);
            joyBase.fillStyle(0x000000, 0.45); joyBase.fillCircle(joyX, joyY, joyR);
            joyBase.lineStyle(3, 0xffffff, 0.3); joyBase.strokeCircle(joyX, joyY, joyR);
            this.joyThumb = this.add.circle(joyX, joyY, 54, 0xffffff, 0.4).setScrollFactor(0).setDepth(191);
            this.joyThumbGlow = this.add.circle(joyX, joyY, 54, 0xffffff, 0).setScrollFactor(0).setDepth(191);
            const joyHit = this.add.circle(joyX, joyY, joyR + 40, 0x000000, 0.001).setScrollFactor(0).setDepth(192).setInteractive();
            this.joyActive = false; this.joyPointerId = -1;
            this.joyCenter = { x: joyX, y: joyY }; this.joyRadius = joyR;
            joyHit.on('pointerdown', (pointer) => { this.joyActive = true; this.joyPointerId = pointer.id; this.joyThumbGlow.setFillStyle(0xffffff, 0.2); this._updateJoystick(pointer); });
            this.input.on('pointermove', (pointer) => { if (this.joyActive && pointer.id === this.joyPointerId) this._updateJoystick(pointer); });
            this.input.on('pointerup', (pointer) => { if (this.joyActive && pointer.id === this.joyPointerId) { this.joyActive = false; this.joyPointerId = -1; this.joyThumb.setPosition(joyX, joyY); this.joyThumbGlow.setPosition(joyX, joyY).setFillStyle(0xffffff, 0); this.virtualInput = { x: 0, y: 0 }; } });

            // --- MOBILE ACTION BUTTON (E) ---
            const actX = screenWidth - 300, actY = screenHeight - 450;
            const actBtnGfx = this.add.graphics().setScrollFactor(0).setDepth(190);
            actBtnGfx.fillStyle(0xffffff, 0.2); actBtnGfx.fillCircle(actX, actY, 68);
            actBtnGfx.lineStyle(3, 0xffffff, 0.35); actBtnGfx.strokeCircle(actX, actY, 68);
            this.mobileActionLabel = this.add.text(actX, actY, 'E', { fontSize: '56px', fontFamily: 'Courier New', color: '#ffffff', fontStyle: 'bold' }).setOrigin(0.5).setScrollFactor(0).setDepth(191).setAlpha(0.8);
            const actHit = this.add.circle(actX, actY, 80, 0x000000, 0.001).setScrollFactor(0).setDepth(192).setInteractive();
            actHit.on('pointerdown', () => { this.handleInteraction(); this.tweens.add({ targets: this.mobileActionLabel, scale: 0.85, duration: 80, yoyo: true }); });
            this.input.on('pointerdown', (pointer) => {
                if (this.isTransitioning) return;
                const dJoy = Phaser.Math.Distance.Between(pointer.x, pointer.y, joyX, joyY);
                const dAct = Phaser.Math.Distance.Between(pointer.x, pointer.y, actX, actY);
                if (dJoy < joyR + 60 || dAct < 100) return;
                if (pointer.y > screenHeight - 500) return;
                const worldPoint = this.cameras.main.getWorldPoint(pointer.x, pointer.y);
                this.targetX = worldPoint.x; this.targetY = worldPoint.y;
                this.physics.moveToObject(this.player, worldPoint, 250);
            });

            this.walkablePolygon = [
                { x: 0.21, y: 0.60 }, { x: 0.38, y: 0.51 }, { x: 0.42, y: 0.50 }, { x: 0.475, y: 0.505 }, { x: 0.67, y: 0.60 },
                { x: 0.74, y: 0.57 }, { x: 0.90, y: 0.65 }, { x: 0.50, y: 0.80 },
                { x: 0.485, y: 0.70 }, { x: 0.46, y: 0.695 }, { x: 0.43, y: 0.71 },
            ];
            this.ottomanPolygon = [{ x: 0.34, y: 0.60 }, { x: 0.43, y: 0.54 }, { x: 0.52, y: 0.59 }, { x: 0.43, y: 0.65 }];
            this.roomWidth = roomWidth; this.roomHeight = roomHeight;
            this.greenLineStart = { x: 0.50, y: 0.80 }; this.greenLineEnd = { x: 0.90, y: 0.65 };
            this.lockedDoorPoly = [{ x: 0.74, y: 0.48 }, { x: 0.86, y: 0.52 }, { x: 0.86, y: 0.62 }, { x: 0.74, y: 0.58 }];

            // --- STYLED LOCKED DOOR MESSAGE ---
            this.lockedDoorContainer = this.add.container(roomWidth * 0.80, roomHeight * 0.42).setDepth(100).setAlpha(0);
            const msgBg = this.add.graphics();
            const msgW = 320, msgH = 60, msgR = 16;
            msgBg.fillStyle(0x000000, 0.75); msgBg.fillRoundedRect(-msgW/2, -msgH/2, msgW, msgH, msgR);
            msgBg.lineStyle(1, 0xffffff, 0.15); msgBg.strokeRoundedRect(-msgW/2, -msgH/2, msgW, msgH, msgR);
            const msgText = this.add.text(0, 0, 'Еще не время...', { fontSize: '28px', fontFamily: 'Courier New', color: '#ffffff', fontStyle: 'bold' }).setOrigin(0.5);
            this.lockedDoorContainer.add([msgBg, msgText]);
            this.lockedDoorShowing = false;

            // === INTERACTION SYSTEM ===
            this.interactiveItems = [
                { id: 'guitar', proximityCenter: { x: 0.25, y: 0.60 }, proximityRadius: 90, lineOverlay: 'line_guitar', actionOverlay: null, soundKey: 'sound_guitar' },
                { id: 'ps_controller', proximityCenter: { x: 0.65, y: 0.60 }, proximityRadius: 100, lineOverlay: 'line_ps_controller', actionOverlay: null, soundKey: null, isTVSwitch: true },
                { id: 'lights', proximityCenter: { x: 0.42, y: 0.68 }, proximityRadius: 80, lineOverlay: null, actionOverlay: null, soundKey: null, isLightSwitch: true },
            ];
            this.interactiveItems.forEach(item => {
                if (item.isLightSwitch) { item.lineSprite = null; item.actionSprite = null; item.state = (window.roomLightMode !== 'default') ? 'active' : 'idle'; item._glowVisible = false; return; }
                if (item.isTVSwitch) {
                    item.lineSprite = this.textures.exists(item.lineOverlay) ? this.add.image(0, 0, item.lineOverlay).setOrigin(0, 0).setScale(scale).setVisible(false).setDepth(5) : null;
                    item.actionSprite = null;
                    item.tvSprites = {};
                    Object.keys(TV_GAME_TEXTURES).forEach(mode => { if (this.textures.exists(TV_GAME_TEXTURES[mode])) { item.tvSprites[mode] = this.add.image(0, 0, TV_GAME_TEXTURES[mode]).setOrigin(0, 0).setScale(scale).setVisible(false).setDepth(5); } });
                    if (window.tvGameMode !== 'off') { item.state = 'active'; item._glowVisible = false; if (item.tvSprites[window.tvGameMode]) item.tvSprites[window.tvGameMode].setVisible(true); }
                    else { item.state = 'idle'; item._glowVisible = false; }
                    return;
                }
                item.lineSprite = (item.lineOverlay && this.textures.exists(item.lineOverlay)) ? this.add.image(0, 0, item.lineOverlay).setOrigin(0, 0).setScale(scale).setVisible(false).setDepth(5) : null;
                item.actionSprite = (item.actionOverlay && this.textures.exists(item.actionOverlay)) ? this.add.image(0, 0, item.actionOverlay).setOrigin(0, 0).setScale(scale).setVisible(false).setDepth(5) : null;
                if (window.activeItems[item.id]) { item.state = 'active'; item._glowVisible = false; if (item.actionSprite) item.actionSprite.setVisible(true); }
                else { item.state = 'idle'; }
            });
            this.interactionCooldown = 0;
            this.ePrompt = this.add.text(0, 0, '[E]', { fontSize: '36px', fontFamily: 'Courier New', color: '#ffffff', backgroundColor: '#000000aa', padding: { x: 12, y: 6 }, fontStyle: 'bold' }).setOrigin(0.5).setDepth(150).setVisible(false);
            this.tweens.add({ targets: this.ePrompt, alpha: { from: 0.6, to: 1 }, scaleX: { from: 0.95, to: 1.05 }, scaleY: { from: 0.95, to: 1.05 }, duration: 800, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
            this.eKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.E);

            // --- TOAST ---
            this.toastContainer = this.add.container(screenWidth / 2, 120).setScrollFactor(0).setDepth(300).setAlpha(0);
            const toastW = 400, toastH = 56, toastR = 14;
            const toastBgGfx = this.add.graphics();
            toastBgGfx.fillStyle(0x0a0a0f, 0.8); toastBgGfx.fillRoundedRect(-toastW/2, -toastH/2, toastW, toastH, toastR);
            toastBgGfx.lineStyle(1, 0xffffff, 0.12); toastBgGfx.strokeRoundedRect(-toastW/2, -toastH/2, toastW, toastH, toastR);
            this.toastText = this.add.text(0, 0, '', { fontSize: '24px', fontFamily: 'Courier New', color: '#ffffff', fontStyle: 'bold' }).setOrigin(0.5);
            this.toastContainer.add([toastBgGfx, this.toastText]);
            this.toastTimer = null;
            this.player.setCollideWorldBounds(false);

            const blackCover = this.add.rectangle(screenWidth / 2, screenHeight / 2, screenWidth * 2, screenHeight * 2, 0x000000).setScrollFactor(0).setDepth(9999);
            this.tweens.add({ targets: blackCover, alpha: 0, duration: 1000, onComplete: () => { blackCover.destroy(); } });

            if (window.timeOfDay === 'day' && !window.nightTriggered) {
                this.time.delayedCall(10000, () => {
                    if (window.nightTriggered) return;
                    window.timeOfDay = 'night'; window.nightTriggered = true;
                    if (!this.scene.isActive()) return;
                    const nightBg = this.add.image(0, 0, 'room1_night').setOrigin(0, 0).setScale(scale).setAlpha(0).setDepth(this.bg.depth);
                    this.tweens.add({ targets: nightBg, alpha: 1, duration: 2000, onComplete: () => { this.bg.setTexture('room1_night'); nightBg.destroy(); } });
                });
            }
        }

            this.interactiveItems = [
                { id: 'audio_interface', proximityCenter: { x: 0.35, y: 0.60 }, proximityRadius: 90, lineOverlay: 'line_audio_interface', actionOverlay: null, soundKey: null, isTrackSwitch: true },
                { id: 'wardrobe', proximityCenter: { x: 0.60, y: 0.53 }, proximityRadius: 90, lineOverlay: 'line_rick_owens', actionOverlay: null, soundKey: null, isWardrobeSwitch: true },
                { id: 'lights', proximityCenter: { x: 0.67, y: 0.63 }, proximityRadius: 90, lineOverlay: null, actionOverlay: null, soundKey: null, isLightSwitch: true },
            ];
            this.interactiveItems.forEach(item => {
                if (item.isLightSwitch) { item.lineSprite = null; item.actionSprite = null; item.state = (window.roomLightMode !== 'default') ? 'active' : 'idle'; item._glowVisible = false; return; }
                if (item.isTrackSwitch) {
                    item.lineSprite = (item.lineOverlay && this.textures.exists(item.lineOverlay)) ? this.add.image(0, 0, item.lineOverlay).setOrigin(0, 0).setScale(scale).setVisible(false).setDepth(5) : null;
                    item.actionSprite = null;
                    item.state = (window.currentTrack !== 'off') ? 'active' : 'idle'; item._glowVisible = false; return;
                }
                if (item.isWardrobeSwitch) {
                    item.lineSprite = (item.lineOverlay && this.textures.exists(item.lineOverlay)) ? this.add.image(0, 0, item.lineOverlay).setOrigin(0, 0).setScale(scale).setVisible(false).setDepth(5) : null;
                    item.actionSprite = null;
                    item.state = (window.wardrobeIndex >= 0) ? 'active' : 'idle'; item._glowVisible = false; return;
                }
                item.lineSprite = (item.lineOverlay && this.textures.exists(item.lineOverlay)) ? this.add.image(0, 0, item.lineOverlay).setOrigin(0, 0).setScale(scale).setVisible(false).setDepth(5) : null;
                item.actionSprite = (item.actionOverlay && this.textures.exists(item.actionOverlay)) ? this.add.image(0, 0, item.actionOverlay).setOrigin(0, 0).setScale(scale).setVisible(false).setDepth(5) : null;
                if (window.activeItems[item.id]) { item.state = 'active'; item._glowVisible = false; if (item.actionSprite) item.actionSprite.setVisible(true); }
                else { item.state = 'idle'; }
            });
            this.interactionCooldown = 0;
            this.ePrompt = this.add.text(0, 0, '[E]', { fontSize: '36px', fontFamily: 'Courier New', color: '#ffffff', backgroundColor: '#000000aa', padding: { x: 12, y: 6 }, fontStyle: 'bold' }).setOrigin(0.5).setDepth(150).setVisible(false);
            this.tweens.add({ targets: this.ePrompt, alpha: { from: 0.6, to: 1 }, scaleX: { from: 0.95, to: 1.05 }, scaleY: { from: 0.95, to: 1.05 }, duration: 800, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
            this.eKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.E);

            this.toastContainer = this.add.container(screenWidth / 2, 120).setScrollFactor(0).setDepth(300).setAlpha(0);
            const toastBgGfx = this.add.graphics();
            toastBgGfx.fillStyle(0x0a0a0f, 0.8); toastBgGfx.fillRoundedRect(-200, -28, 400, 56, 14);
            toastBgGfx.lineStyle(1, 0xffffff, 0.12); toastBgGfx.strokeRoundedRect(-200, -28, 400, 56, 14);
            this.toastText = this.add.text(0, 0, '', { fontSize: '24px', fontFamily: 'Courier New', color: '#ffffff', fontStyle: 'bold' }).setOrigin(0.5);
            this.toastContainer.add([toastBgGfx, this.toastText]);
            this.toastTimer = null;
            this.player.setCollideWorldBounds(false);

            const blackCover = this.add.rectangle(screenWidth / 2, screenHeight / 2, screenWidth * 2, screenHeight * 2, 0x000000).setScrollFactor(0).setDepth(9999);
            this.tweens.add({ targets: blackCover, alpha: 0, duration: 1000, onComplete: () => { blackCover.destroy(); } });
            if (window.timeOfDay === 'day' && !window.nightTriggered) {
                this.time.delayedCall(10000, () => {
                    if (window.nightTriggered) return; window.timeOfDay = 'night'; window.nightTriggered = true;
                    if (!this.scene.isActive()) return;
                    const nightBg = this.add.image(0, 0, 'room2_night').setOrigin(0, 0).setScale(scale).setAlpha(0).setDepth(this.bg.depth);
                    this.tweens.add({ targets: nightBg, alpha: 1, duration: 2000, onComplete: () => { this.bg.setTexture('room2_night'); nightBg.destroy(); } });
                });
            }
        }
        handleInteraction() {
            const rw = this.roomWidth, rh = this.roomHeight;
            let nearestItem = null, nearestDist = Infinity;
            this.interactiveItems.forEach(item => { const cx = item.proximityCenter.x*rw, cy = item.proximityCenter.y*rh; const dist = Phaser.Math.Distance.Between(this.player.x, this.player.y, cx, cy); if (dist < item.proximityRadius && dist < nearestDist) { nearestDist = dist; nearestItem = item; } });
            if (!nearestItem) return;
            if (nearestItem.isLightSwitch) {
                if (window.timeOfDay !== 'night') { this.showToast('Смысл включать свет днём?'); this.interactionCooldown = 500; return; }
                const nextIdx = (LIGHT_MODES.indexOf(window.roomLightMode) + 1) % LIGHT_MODES.length;
                window.roomLightMode = LIGHT_MODES[nextIdx];
                this.bg.setTexture(window.roomLightMode === 'default' ? 'room2_night' : ('room2_' + window.roomLightMode));
                this.updatePlayerSprite(); nearestItem.state = (window.roomLightMode !== 'default') ? 'active' : 'idle'; this.interactionCooldown = 500; return;
            }
            if (nearestItem.isTrackSwitch) {
                try {
                    if (window.activeAudio && window.activeAudio.sound) { window.activeAudio.sound.stop(); window.activeAudio.sound.destroy(); window.activeAudio = null; }
                } catch(e) { window.activeAudio = null; }
                const nextIdx = (APOLLO_TRACKS.indexOf(window.currentTrack) + 1) % APOLLO_TRACKS.length;
                window.currentTrack = APOLLO_TRACKS[nextIdx];
                if (window.currentTrack !== 'off') {
                    try {
                        const sk = APOLLO_TRACK_KEYS[window.currentTrack];
                        if (this.cache.audio.exists(sk)) {
                            const snd = this.sound.add(sk, { loop: true, volume: 0.5 }); snd.play();
                            window.activeAudio = { itemId: nearestItem.id, soundKey: sk, sound: snd };
                        } else { console.warn('Audio not loaded:', sk); }
                    } catch(e) { console.warn('Sound error:', e); }
                }
                nearestItem.state = (window.currentTrack !== 'off') ? 'active' : 'idle';
                if (window.currentTrack !== 'off') window.activeItems[nearestItem.id] = true; else delete window.activeItems[nearestItem.id];
                this.interactionCooldown = 500; return;
            }
            // --- WARDROBE SWITCH ---
            if (nearestItem.isWardrobeSwitch) {
                // If message is currently showing → hide it, don't advance
                if (this.wardrobeShowing) {
                    this._hideWardrobeMsg();
                    this.interactionCooldown = 300;
                    return;
                }
                // Hide previous overlay
                if (window.wardrobeIndex >= 0) {
                    const prevKey = WARDROBE_ITEMS[window.wardrobeIndex].key;
                    if (this.wardrobeSprites[prevKey]) this.wardrobeSprites[prevKey].setVisible(false);
                }
                // Advance to next (cycles: 0→1→2→3→4→0→...)
                window.wardrobeIndex = (window.wardrobeIndex + 1) % WARDROBE_ITEMS.length;
                const wi = WARDROBE_ITEMS[window.wardrobeIndex];
                // Show new overlay
                if (this.wardrobeSprites[wi.key]) this.wardrobeSprites[wi.key].setVisible(true);
                // Show label
                this._showWardrobeMsg(wi.description);
                nearestItem.state = 'active';
                window.activeItems[nearestItem.id] = true;
                this.interactionCooldown = 500;
                return;
            }
            if (nearestItem.state === 'active') {
                if (nearestItem.actionSprite) nearestItem.actionSprite.setVisible(false);
                if (nearestItem.lineSprite) nearestItem.lineSprite.setVisible(false);
                nearestItem._glowVisible = false;
                try { if (window.activeAudio && window.activeAudio.itemId === nearestItem.id && window.activeAudio.sound) { window.activeAudio.sound.stop(); window.activeAudio.sound.destroy(); window.activeAudio = null; } } catch(e) { window.activeAudio = null; }
                delete window.activeItems[nearestItem.id]; nearestItem.state = 'idle'; this.interactionCooldown = 500; return;
            }
            if (nearestItem.state === 'near') {
                if (nearestItem.actionSprite) nearestItem.actionSprite.setVisible(true);
                if (nearestItem.lineSprite) nearestItem.lineSprite.setVisible(true).setAlpha(1);
                if (nearestItem.soundKey) {
                    try {
                        if (window.activeAudio && window.activeAudio.sound) { window.activeAudio.sound.stop(); window.activeAudio.sound.destroy(); }
                        if (this.cache.audio.exists(nearestItem.soundKey)) {
                            const snd = this.sound.add(nearestItem.soundKey, { loop: true, volume: 0.5 }); snd.play();
                            window.activeAudio = { itemId: nearestItem.id, soundKey: nearestItem.soundKey, sound: snd };
                        } else { console.warn('Audio not loaded:', nearestItem.soundKey); }
                    } catch(e) { console.warn('Sound error:', e); }
                }
                window.activeItems[nearestItem.id] = true; nearestItem.state = 'active'; nearestItem._glowVisible = true;
            }
        }
        _showWardrobeMsg(label) {
            this.wardrobeText.setText(label);
            this.wardrobeShowing = true;
            this.tweens.killTweensOf(this.wardrobeContainer);
            if (this.wardrobeAutoHideTimer) { this.wardrobeAutoHideTimer.remove(); this.wardrobeAutoHideTimer = null; }
            this.wardrobeContainer.setScale(0.8).setAlpha(0);
            this.tweens.add({ targets: this.wardrobeContainer, alpha: 1, scale: 1, duration: 300, ease: 'Back.easeOut' });
            // Auto-hide after 3 seconds
            this.wardrobeAutoHideTimer = this.time.delayedCall(3000, () => { this._hideWardrobeMsg(); });
        }
        _hideWardrobeMsg() {
            if (!this.wardrobeShowing) return;
            this.wardrobeShowing = false;
            if (this.wardrobeAutoHideTimer) { this.wardrobeAutoHideTimer.remove(); this.wardrobeAutoHideTimer = null; }
            this.tweens.killTweensOf(this.wardrobeContainer);
            this.tweens.add({ targets: this.wardrobeContainer, alpha: 0, scale: 0.8, duration: 200, ease: 'Sine.easeIn' });
        }
        showToast(message) {
            this.toastText.setText(message); this.tweens.killTweensOf(this.toastContainer);
            if (this.toastTimer) { this.toastTimer.remove(); this.toastTimer = null; }
            this.toastContainer.setY(80).setAlpha(0).setScale(0.9);
            this.tweens.add({ targets: this.toastContainer, alpha: 1, y: 120, scale: 1, duration: 350, ease: 'Back.easeOut' });
            this.toastTimer = this.time.delayedCall(2500, () => { this.tweens.add({ targets: this.toastContainer, alpha: 0, y: 80, scale: 0.9, duration: 250, ease: 'Sine.easeIn' }); });
        }
        _updateJoystick(pointer) {
            const dx = pointer.x - this.joyCenter.x, dy = pointer.y - this.joyCenter.y;
            const dist = Math.sqrt(dx*dx + dy*dy), maxDist = this.joyRadius - 20, clampDist = Math.min(dist, maxDist);
            const angle = Math.atan2(dy, dx);
            this.joyThumb.setPosition(this.joyCenter.x + Math.cos(angle)*clampDist, this.joyCenter.y + Math.sin(angle)*clampDist);
            this.joyThumbGlow.setPosition(this.joyThumb.x, this.joyThumb.y);
            const deadzone = 20, norm = Math.max(0, dist - deadzone) / (maxDist - deadzone), clamped = Math.min(norm, 1);
            this.virtualInput.x = clamped > 0 ? Math.cos(angle)*clamped : 0;
            this.virtualInput.y = clamped > 0 ? Math.sin(angle)*clamped : 0;
        }
        updatePlayerSprite() {
            const suffix = (window.timeOfDay === 'night' && window.roomLightMode !== 'default') ? '_' + window.roomLightMode : '';
            if (this.playerAnimSuffix === suffix) return; this.playerAnimSuffix = suffix;
            this.player.anims.play((this.player.body.velocity.length() > 10 ? 'walk-' : 'idle-') + this.playerDirection + suffix, true);
        }
        pointInPolygon(px, py, polygon, rw, rh) {
            let inside = false;
            for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
                const xi = polygon[i].x*rw, yi = polygon[i].y*rh, xj = polygon[j].x*rw, yj = polygon[j].y*rh;
                if (((yi > py) !== (yj > py)) && (px < (xj-xi)*(py-yi)/(yj-yi)+xi)) inside = !inside;
            }
            return inside;
        }
        pointToLineDistance(px, py, x1, y1, x2, y2) {
            const A=px-x1,B=py-y1,C=x2-x1,D=y2-y1; let t=Math.max(0,Math.min(1,(C*C+D*D)!==0?(A*C+B*D)/(C*C+D*D):-1));
            const xx=x1+t*C,yy=y1+t*D; return Math.sqrt((px-xx)*(px-xx)+(py-yy)*(py-yy));
        }
        update() {
            const moveSpeed = 250, rw = this.roomWidth, rh = this.roomHeight;
            if (Phaser.Input.Keyboard.JustDown(this.eKey)) this.handleInteraction();
            if (this.interactionCooldown > 0) this.interactionCooldown -= this.game.loop.delta;
            let vx = 0, vy = 0;
            const kbL = this.wasd.left.isDown || this.cursors.left.isDown, kbR = this.wasd.right.isDown || this.cursors.right.isDown;
            const kbU = this.wasd.up.isDown || this.cursors.up.isDown, kbD = this.wasd.down.isDown || this.cursors.down.isDown;
            if (kbL) vx = -moveSpeed; else if (kbR) vx = moveSpeed;
            if (kbU) vy = -moveSpeed; else if (kbD) vy = moveSpeed;
            if (this.joyActive && (Math.abs(this.virtualInput.x) > 0.01 || Math.abs(this.virtualInput.y) > 0.01)) { vx = this.virtualInput.x * moveSpeed; vy = this.virtualInput.y * moveSpeed; }
            const usingInput = kbL || kbR || kbU || kbD || this.joyActive;
            if (usingInput) { this.targetX = null; this.targetY = null; }
            if (this.targetX !== null && this.targetY !== null) {
                const distance = Phaser.Math.Distance.Between(this.player.x, this.player.y, this.targetX, this.targetY);
                if (distance < 10) { this.targetX = null; this.targetY = null; }
                else { const a = Math.atan2(this.targetY-this.player.y, this.targetX-this.player.x); vx = Math.cos(a)*moveSpeed; vy = Math.sin(a)*moveSpeed; }
            }
            const dt = this.game.loop.delta / 1000, nextX = this.player.x + vx*dt, nextY = this.player.y + vy*dt;
            const inOuter = this.pointInPolygon(nextX, nextY, this.walkablePolygon, rw, rh), inChair = this.pointInPolygon(nextX, nextY, this.chairPolygon, rw, rh);
            if (inOuter && !inChair) this.player.body.setVelocity(vx, vy);
            else {
                const xOk = this.pointInPolygon(this.player.x+vx*dt, this.player.y, this.walkablePolygon, rw, rh) && !this.pointInPolygon(this.player.x+vx*dt, this.player.y, this.chairPolygon, rw, rh);
                const yOk = this.pointInPolygon(this.player.x, this.player.y+vy*dt, this.walkablePolygon, rw, rh) && !this.pointInPolygon(this.player.x, this.player.y+vy*dt, this.chairPolygon, rw, rh);
                if (xOk && !yOk) this.player.body.setVelocity(vx, 0); else if (yOk && !xOk) this.player.body.setVelocity(0, vy); else this.player.body.setVelocity(0, 0);
            }
            if (!usingInput && this.targetX === null) this.player.body.setVelocity(0, 0);
            if (!this.isTransitioning) {
                const dist = this.pointToLineDistance(this.player.x, this.player.y, this.greenLineStart.x*rw, this.greenLineStart.y*rh, this.greenLineEnd.x*rw, this.greenLineEnd.y*rh);
                if (dist < 30) {
                    this.isTransitioning = true; this.player.body.setVelocity(0, 0);
                    if (this.wardrobeShowing) this._hideWardrobeMsg();
                    // Hide wardrobe overlays on transition
                    Object.values(this.wardrobeSprites).forEach(s => s.setVisible(false));
                    this.interactiveItems.forEach(item => { if (item.state === 'active') { if (item.actionSprite) item.actionSprite.setVisible(false); if (item.lineSprite) item.lineSprite.setVisible(false); if (item.tvSprites) Object.values(item.tvSprites).forEach(s => s.setVisible(false)); item._glowVisible = false; } });
                    this.scene.transition({ target: 'MainScene', data: { fromStudio: true }, duration: 800, moveBelow: true, onUpdate: (p) => { this.cameras.main.setAlpha(1-p); } });
                }
            }
            const inDoorZone = this.pointInPolygon(this.player.x, this.player.y, this.lockedDoorPoly, rw, rh);
            if (inDoorZone && !this.lockedDoorShowing) { this.lockedDoorShowing = true; this.tweens.killTweensOf(this.lockedDoorContainer); this.lockedDoorContainer.setScale(0.8); this.tweens.add({ targets: this.lockedDoorContainer, alpha: 1, scale: 1, duration: 300, ease: 'Back.easeOut' }); }
            else if (!inDoorZone && this.lockedDoorShowing) { this.lockedDoorShowing = false; this.tweens.killTweensOf(this.lockedDoorContainer); this.tweens.add({ targets: this.lockedDoorContainer, alpha: 0, scale: 0.8, duration: 200, ease: 'Sine.easeIn' }); }
            const s = this.playerAnimSuffix, speed = this.player.body.velocity.length();
            if (speed > 10) { const deg = Phaser.Math.RadToDeg(Math.atan2(this.player.body.velocity.y, this.player.body.velocity.x)); if (deg > -45 && deg <= 45) { this.player.anims.play('walk-right'+s, true); this.playerDirection='right'; } else if (deg > 45 && deg <= 135) { this.player.anims.play('walk-down'+s, true); this.playerDirection='down'; } else if (deg > 135 || deg <= -135) { this.player.anims.play('walk-left'+s, true); this.playerDirection='left'; } else { this.player.anims.play('walk-up'+s, true); this.playerDirection='up'; } }
            else { this.player.anims.play('idle-'+this.playerDirection+s, true); }
            let playerInCircle = false;
            if (this.interactionCooldown <= 0) {
                this.interactiveItems.forEach(item => {
                    const cx = item.proximityCenter.x*rw, cy = item.proximityCenter.y*rh;
                    const dist = Phaser.Math.Distance.Between(this.player.x, this.player.y, cx, cy);
                    const inRange = dist < item.proximityRadius;
                    if (item.isLightSwitch) { if (inRange) { if (item.state==='idle') item.state='near'; playerInCircle=true; } else { if (item.state==='near') item.state='idle'; } return; }
                    // Wardrobe: always interactive when in range
                    if (item.isWardrobeSwitch) { if (inRange) { if (item.state==='idle') item.state='near'; playerInCircle=true; } else { if (item.state==='near') item.state='idle'; if (this.wardrobeShowing) this._hideWardrobeMsg(); } return; }
                    if (item.state === 'active') { if (inRange) { if (!item._glowVisible && item.lineSprite) { item.lineSprite.setVisible(true).setAlpha(0); this.tweens.add({ targets: item.lineSprite, alpha: 1, duration: 300 }); item._glowVisible=true; } playerInCircle=true; } else { if (item._glowVisible && item.lineSprite) { this.tweens.add({ targets: item.lineSprite, alpha: 0, duration: 200, onComplete: () => { item.lineSprite.setVisible(false); } }); item._glowVisible=false; } } return; }
                    if (inRange) { if (item.state !== 'near') { if (item.lineSprite) { item.lineSprite.setVisible(true).setAlpha(0); this.tweens.add({ targets: item.lineSprite, alpha: 1, duration: 300 }); } item.state='near'; } playerInCircle=true; }
                    else if (item.state === 'near') { if (item.lineSprite) { this.tweens.add({ targets: item.lineSprite, alpha: 0, duration: 200, onComplete: () => { item.lineSprite.setVisible(false); } }); } item.state='idle'; }
                });
            }
            if (playerInCircle) {
                this.ePrompt.setPosition(this.player.x, this.player.y - 140);
                const nearLight = this.interactiveItems.find(i => i.isLightSwitch && Phaser.Math.Distance.Between(this.player.x, this.player.y, i.proximityCenter.x*rw, i.proximityCenter.y*rh) < i.proximityRadius);
                const nearTrack = this.interactiveItems.find(i => i.isTrackSwitch && Phaser.Math.Distance.Between(this.player.x, this.player.y, i.proximityCenter.x*rw, i.proximityCenter.y*rh) < i.proximityRadius);
                const nearWardrobe = this.interactiveItems.find(i => i.isWardrobeSwitch && Phaser.Math.Distance.Between(this.player.x, this.player.y, i.proximityCenter.x*rw, i.proximityCenter.y*rh) < i.proximityRadius);
                if (nearLight) { this.ePrompt.setText(window.timeOfDay==='night' ? '[E] Lights: '+(window.roomLightMode==='default'?'OFF':window.roomLightMode.toUpperCase()) : '[E] Lights'); }
                else if (nearTrack) { this.ePrompt.setText('[E] Apollo: '+APOLLO_TRACK_NAMES[window.currentTrack]); }
                else if (nearWardrobe) { const wLabel = window.wardrobeIndex >= 0 ? WARDROBE_ITEMS[window.wardrobeIndex].label : '...'; this.ePrompt.setText('[E] ' + wLabel); }
                else { this.ePrompt.setText('[E]'); }
                this.ePrompt.setVisible(true);
            } else { this.ePrompt.setText('[E]'); this.ePrompt.setVisible(false); }
        }
    }

    const config = {
        type: Phaser.AUTO,
        backgroundColor: '#000000',
        scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH, width: 1080, height: 1920 },
        input: { activePointers: 3 },
        physics: { default: 'arcade', arcade: { debug: false, gravity: { y: 0 } } },
        render: { antialias: false, pixelArt: true },
        scene: [MenuScene, MainScene, StudioScene]
    };
    const game = new Phaser.Game(config);
</script>
